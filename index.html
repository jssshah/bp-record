<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vitality BP Record</title>
<meta name="theme-color" content="#13223F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E9F1; --ink:#13223F; --muted:#56637D; --line:#D3DAE6;
  --navy:#13223F; --on-navy:#F3F5F9; --accent:#1D5FC4; --accent-ink:#FFFFFF; --gold:#8F6206; --gold-bg:#FFF0C9;
  --good:#1B7A4C; --good-bg:#DDF2E6; --warn:#985806; --warn-bg:#FDEBD2; --bad:#B3261E; --bad-bg:#FADFDB;
  --sbp:#13223F; --dbp:#1D5FC4;
  --sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1220; --surface:#142035; --sunk:#0F1A2D; --ink:#E6ECF7; --muted:#9DAAC4; --line:#27365A;
    --navy:#0F1A2D; --on-navy:#E6ECF7; --accent:#6EA1F3; --accent-ink:#0B1220; --gold:#F2B94A; --gold-bg:#3A2D10;
    --good:#62CE94; --good-bg:#11301F; --warn:#F2AC55; --warn-bg:#3A2710; --bad:#FF8C82; --bad-bg:#3D1715;
    --sbp:#E6ECF7; --dbp:#6EA1F3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1220; --surface:#142035; --sunk:#0F1A2D; --ink:#E6ECF7; --muted:#9DAAC4; --line:#27365A;
  --navy:#0F1A2D; --on-navy:#E6ECF7; --accent:#6EA1F3; --accent-ink:#0B1220; --gold:#F2B94A; --gold-bg:#3A2D10;
  --good:#62CE94; --good-bg:#11301F; --warn:#F2AC55; --warn-bg:#3A2710; --bad:#FF8C82; --bad-bg:#3D1715;
  --sbp:#E6ECF7; --dbp:#6EA1F3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:.88rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:var(--on-navy)}
.bar-in{max-width:640px;margin:0 auto;height:60px;padding-inline:8px 12px;display:flex;align-items:center;gap:6px}
.icon-btn{width:48px;height:48px;border:0;background:transparent;color:inherit;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:26px;height:26px}
.bar img{width:38px;height:38px;border-radius:50%;background:#fff;margin-left:6px;flex:none}
.bar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:4px}
.bar-title b{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title span{font-size:.75rem;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--on-navy) 14%,transparent);color:var(--on-navy);flex:none}
.sync i{width:9px;height:9px;border-radius:50%;background:#9DAAC4}
.sync.ok i{background:#5BD08F}.sync.wait i{background:#F2B94A}.sync.err i{background:#FF8C82}

main{max-width:640px;margin:0 auto;padding-inline:14px;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
main.wiz{padding-bottom:130px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{height:64px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.8rem;font-weight:600;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:.68rem;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}

/* action footer (wizard) */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.foot-in.one{grid-template-columns:1fr}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h h2,.card>h2{font-size:1.05rem;font-weight:800}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.banner{background:var(--gold-bg);border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.c-good{background:var(--good-bg);color:var(--good)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-gold{background:var(--gold-bg);color:var(--gold)}.c-plain{background:var(--sunk);color:var(--muted)}

.btn{min-height:52px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:1.02rem;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.big{min-height:60px;font-size:1.12rem}
.btn:disabled{opacity:.45}
.btn svg{width:22px;height:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0;min-height:44px}

/* search + list */
.search{position:relative}
.search input{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px 0 46px;font-size:1.05rem}
.search svg{position:absolute;left:14px;top:15px;width:22px;height:22px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding-inline:14px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600;font-size:.92rem;color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pitem{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:14px 16px;border-top:1px solid var(--line);min-height:72px;align-items:center}
.pitem:first-child{border-top:0}
.pitem .n{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .s{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:9;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:8px;padding:0 20px;box-shadow:0 6px 18px rgba(19,34,63,.28)}
.fab svg{width:24px;height:24px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* patient */
.hero{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px}
.hero .who{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hero h1{font-size:1.35rem;font-weight:800}
.hero .meta{font-size:.86rem;opacity:.82;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.hero .bp{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero .bpv{font-family:var(--mono);font-weight:700;font-size:3.1rem;line-height:1;letter-spacing:-.02em}
.hero .bpv small{font-size:.85rem;font-weight:400;opacity:.75;margin-left:4px;letter-spacing:0}
.hero .chip.c-good{background:#1E5C3F;color:#CFF5DF}.hero .chip.c-warn{background:#6B4410;color:#FFE3B8}.hero .chip.c-bad{background:#7A1E18;color:#FFD9D4}.hero .chip.c-plain{background:rgba(255,255,255,.14);color:var(--on-navy)}
.hero .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .facts div{background:rgba(255,255,255,.09);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.hero .facts dt{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero .facts dd{margin:0;font-weight:700;font-size:.98rem}
.hero .facts .late{color:#FFB4AB}
.contact{display:flex;gap:8px}
.contact a{flex:1;min-height:46px;border-radius:12px;background:rgba(255,255,255,.12);color:var(--on-navy);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.95rem}
.contact svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:5}
.seg button{height:44px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:.92rem}
.rung b{font-family:var(--mono);font-size:1.15rem}
.rung.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.rung.past{opacity:.55}
.med{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.med.stopped{border-style:dashed}
.med-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.med-n{font-weight:800;font-size:1.05rem}
.med-d{font-family:var(--mono);font-weight:700}
.vrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0;padding-top:0}
.vrow .s{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
.f input,.f select,.f textarea{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;font-weight:400;font-size:1.05rem;width:100%;min-width:0}
.f textarea{min-height:88px}
.opts{display:grid;gap:8px}
.opts.c2{grid-template-columns:1fr 1fr}.opts.c4{grid-template-columns:repeat(4,1fr)}
.opt{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-weight:700;text-align:left;display:flex;align-items:center;gap:10px}
.opt.center{justify-content:center;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .tick::after{content:"";width:10px;height:6px;border-left:3px solid var(--accent-ink);border-bottom:3px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}

/* wizard */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.q{font-size:1.3rem;font-weight:800}
.bpgrid{display:grid;grid-template-columns:38px 1fr 20px 1fr;gap:10px 6px;align-items:center}
.bpgrid .h{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.bpgrid .k{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:1rem}
.bpgrid .sl{text-align:center;font-size:1.8rem;color:var(--muted)}
.bpin{width:100%;min-width:0;height:66px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:center;font-family:var(--mono);font-weight:700;font-size:2rem;padding:0}
.bpin:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.avg{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.avg b{font-family:var(--mono);font-size:2.2rem;line-height:1}
.sug{border-radius:14px;padding:16px;border:2px solid;display:flex;flex-direction:column;gap:8px}
.sug.good{background:var(--good-bg);border-color:var(--good)}.sug.warn{background:var(--warn-bg);border-color:var(--warn)}.sug.bad{background:var(--bad-bg);border-color:var(--bad)}.sug.plain{background:var(--sunk);border-color:var(--line)}
.sug b{font-size:1.15rem}
.sug ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:.92rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
code.k{font-family:var(--mono);font-size:.8rem;word-break:break-all;background:var(--sunk);padding:2px 6px;border-radius:6px}
@media (min-width:600px){.hero .bpv{font-size:3.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="bar"><div class="bar-in" id="bar"></div></header>
<main id="main"></main>
<div id="bottom"></div>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>

    if(s>=160||d>=100)return {cls:very?"bad":"warn",title:"Hypertension: start Step 2 today",lines:[stepText(p,2)].concat(very?["Very high: repeat after 15 minutes of rest. Return within 1 week."]:["Return in 4 weeks."]),next:2,ret:very?7:28};
    if(s>=140||d>=90){if(confirmed)return {cls:"warn",title:"Confirmed: start Step 1",lines:[stepText(p,1),"Return in 4 weeks."],next:1,ret:28};return {cls:"warn",title:"Possible hypertension: check again",lines:["Come back within 2 weeks for a second check before starting medicines."],next:null,ret:14}}
    if(highRisk(p)&&(s>=130||d>=80))return {cls:"plain",title:"High-normal in a high-risk patient",lines:["Physician decides whether to start medicines.","Recheck in 3 months."],next:null,ret:90};
    return {cls:"good",title:"No hypertension today",lines:["Healthy-living advice. Recheck in "+((s>=130||d>=80)?"6 months.":"1 year.")],next:null,ret:(s>=130||d>=80)?182:365};
  }
  if(c.k==="good")return {cls:"good",title:"At target: keep the same medicines",lines:["These medicines will be marked as working.","Return in 3 months."],next:step,ret:90,controlled:true};
  if(missed!=null&&missed>=2)return {cls:"warn",title:"Missing pills: fix that first",lines:["Ask why: cost, side effect, ran out, felt fine, herbs.","Keep the same step. Do not move up yet."],next:step,ret:very?7:28};
  if(step>=max)return {cls:very?"bad":"warn",title:"Last step reached: physician review",lines:["Check the measurement and count leftover pills.","Physician decides next steps."],next:null,ret:very?7:28};
  return {cls:very?"bad":"warn",title:`Above target: move up to Step ${step+1}`,lines:[stepText(p,step+1)].concat(very?["Very high: check danger signs, repeat after 15 minutes. Return within 1 week."]:["Return in 4 weeks."]),next:step+1,ret:very?7:28};
}
function applyStep(p,ns,date){
  const want=stepMeds(p,ns),kept=new Set();
  p.meds.filter(m=>!m.end).forEach(m=>{
    const w=want.find(([dr])=>dr===m.drug);
    if(w&&w[1]===m.dose){kept.add(m.drug);m.status="titrating";return}
    m.end=date;
    if(w){m.reason="dose";m.note=(m.note?m.note+" ":"")+`Changed to ${w[1]} at Step ${ns}.`}
    else if(!m.reason){m.reason="replaced";m.note=(m.note?m.note+" ":"")+`Not part of Step ${ns}.`}
  });
  want.forEach(([dr,x])=>{if(!kept.has(dr))p.meds.push({id:uid(),drug:dr,dose:x,freq:"Once daily",start:date,end:null,status:"titrating",reason:null,note:""})});
  p.step=ns;
}

/* ---------- sync with the clinic Google Sheet ---------- */
let syncing=false, online=navigator.onLine!==false;
function syncState(){
  if(!S.cfg.url)return {k:"",t:"No sync"};
  if(S.syncError)return {k:"err",t:"Sync error"};
  if(!online)return {k:"wait",t:S.outbox.length?S.outbox.length+" to send":"Offline"};
  if(S.outbox.length)return {k:"wait",t:S.outbox.length+" to send"};
  return {k:"ok",t:"Synced"};
}
async function api(action,extra){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(S.cfg.url,{method:"POST",body:JSON.stringify(Object.assign({action,code:S.cfg.code,device:S.device},extra||{})),signal:ctl.signal,redirect:"follow"});
    let j;try{j=await r.json()}catch(_){throw new Error("The link did not answer like the clinic server. Check the link, and that the script is deployed for Anyone")}if(!j.ok)throw new Error(j.error||"Server said no");return j;
  }finally{clearTimeout(tm)}
}
function payload(p){const c=JSON.parse(JSON.stringify(p));c.meds.forEach(m=>m.drugName=medName(m));return c}
async function sync(){
  if(syncing||!S.cfg.url||!S.outbox.length)return drawBar();
  syncing=true;drawBar();
  try{
    for(const id of S.outbox.slice()){
      const p=P(id);
      if(p){const j=await api("upsert",{patient:payload(p)});if(j.newer){const i=S.patients.findIndex(x=>x.id===id);S.patients[i]=j.newer}}
      S.outbox=S.outbox.filter(x=>x!==id);S.lastSync=new Date().toISOString();S.syncError=null;save();
    }
  }catch(e){S.syncError=e.name==="AbortError"?"No answer from the clinic server (slow or no internet)":/Failed to fetch|NetworkError|Load failed/.test(String(e.message))?"No internet connection":String(e.message||e);save()}
  syncing=false;drawBar();
}
window.addEventListener("online",()=>{online=true;sync()});
window.addEventListener("offline",()=>{online=false;drawBar()});
setInterval(()=>{if(document.visibilityState==="visible"&&S.outbox.length)sync()},60000);

function mchip(m){if(m.end){const r=REASONS[m.reason]||REASONS.other;return `<span class="chip ${r.c}">${r.t}</span>`}return m.status==="working"?`<span class="chip c-good">Working</span>`:`<span class="chip c-gold">Adjusting</span>`}
function medCard(m,act){return `<div class="med ${act?"":"stopped"}"><div class="med-h"><span><span class="med-n">${esc(medName(m))}</span> <span class="med-d">${esc(m.dose)}</span></span>${mchip(m)}</div><span class="sm muted">${esc(m.freq||"")} · ${m.start?`since ${fmtS(m.start)}`:"before clinic"}${m.end?` · stopped ${fmtS(m.end)}`:""}${m.note?` · ${esc(m.note)}`:""}</span>${act?`<button class="btn sec" data-stop="${m.id}">Stop, or mark as not working</button>`:""}</div>`}

function chart(p){
  const vs=p.visits;if(vs.length<2)return `<p class="sm muted" style="margin:0">The chart appears after 2 visits.</p>`;
  const W=340,H=190,L=32,R=8,T=12,B=30,t=target(p);
  let lo=Math.min(60,...vs.map(v=>v.dbp-10)),hi=Math.max(200,...vs.map(v=>v.sbp+10));lo=Math.floor(lo/20)*20;hi=Math.ceil(hi/20)*20;
  const x=i=>L+i*(W-L-R)/(vs.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);let g="";
  for(let v=lo;v<=hi;v+=20)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  [t.s,t.d].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${y(v)-4}" font-size="9.5" font-weight="700" fill="var(--good)">target ${v}</text>`);
  const path=k=>vs.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v[k]).toFixed(1)).join(" ");
  g+=`<path d="${path("sbp")}" fill="none" stroke="var(--sbp)" stroke-width="2.5"/><path d="${path("dbp")}" fill="none" stroke="var(--dbp)" stroke-width="2.5"/>`;
  const ev=Math.ceil(vs.length/4);
  vs.forEach((v,i)=>{const last=i===vs.length-1,r=last?5:3.5;g+=`<circle cx="${x(i)}" cy="${y(v.sbp)}" r="${r}" fill="var(--sbp)" stroke="var(--surface)" stroke-width="1.5"/><circle cx="${x(i)}" cy="${y(v.dbp)}" r="${r}" fill="var(--dbp)" stroke="var(--surface)" stroke-width="1.5"/>`;
    if(last)g+=`<text x="${x(i)-8}" y="${y(v.sbp)-9}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--sbp)">${v.sbp}</text><text x="${x(i)-8}" y="${y(v.dbp)+17}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--dbp)">${v.dbp}</text>`;
    if(i%ev===0||last)g+=`<text x="${x(i)}" y="${H-12}" text-anchor="${i===0?"start":last?"end":"middle"}" font-size="10" fill="var(--muted)">${fmtS(v.date)}</text>`;
    if(v.step&&(i===0||vs[i-1].step!==v.step))g+=`<text x="${x(i)}" y="${H-1}" text-anchor="${i===0?"start":last?"end":"middle"}" font-size="9.5" font-weight="700" fill="var(--accent)">S${v.step}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="BP at each visit with target lines">${g}</svg>`;
}

/* ---------- visit wizard ---------- */
function wizSteps(p){const w=V.w,{s,d}=avg(w);const st=["bp"];if(p.step)st.push("pills");else if(s&&(s>=140||d>=90)&&s<160&&d<100)st.push("confirm");if(s&&(s>=180||d>=110))st.push("danger");st.push("plan");return st}
function avg(w){const r=w.r.map(x=>x.map(n=>+n||0));if(r[1][0]&&r[1][1]&&r[2][0]&&r[2][1])return {s:Math.round((r[1][0]+r[2][0])/2),d:Math.round((r[1][1]+r[2][1])/2),n:3};if(r[0][0]&&r[0][1]&&!r[1][0]&&!r[2][0])return {s:r[0][0],d:r[0][1],n:1};return {}}
function vVisit(){
  const p=P(V.id),w=V.w,st=wizSteps(p),cur=st[w.i];
  const dots=`<div class="steps" aria-label="Step ${w.i+1} of ${st.length}">${st.map((_,i)=>`<i class="${i<=w.i?"on":""}"></i>`).join("")}</div>`;
  if(cur==="bp"){
    const a=avg(w);
    return `${dots}<div class="q">Blood pressure</div><p class="sm muted" style="margin:0">Seated, 5 minutes rest, ${esc((p.cuff||"correct").split(" (")[0].toLowerCase())} cuff, ${esc((p.arm||"same").toLowerCase())} arm. 3 readings, 1 minute apart.</p>
    <div class="card"><div class="bpgrid"><span></span><span class="h">Top</span><span></span><span class="h">Bottom</span>
    ${[0,1,2].map(i=>`<span class="k">#${i+1}</span><input class="bpin" id="r${i}s" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="${esc(w.r[i][0])}" aria-label="Reading ${i+1} top number" enterkeyhint="next"><span class="sl">/</span><input class="bpin" id="r${i}d" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="${esc(w.r[i][1])}" aria-label="Reading ${i+1} bottom number" enterkeyhint="next">`).join("")}
    </div></div>
    <div class="avg"><div><div style="font-weight:700">Recorded BP</div><div class="sm" style="opacity:.8">average of #2 and #3</div></div><b id="avgOut">${a.s?a.s+"/"+a.d:"—/—"}</b></div>
    <label class="f">Visit date<input type="date" id="vdate" value="${w.date}"></label>`;
  }
  if(cur==="pills")return `${dots}<div class="q">In the last 7 days, how many days were pills missed?</div><div class="opts c4">${[0,1,2,3,4,5,6,7].map(n=>`<button class="opt center" data-missed="${n}" aria-pressed="${w.missed===n}" style="font-size:1.4rem;min-height:64px">${n}</button>`).join("")}</div><p class="sm muted" style="margin:0">Ask kindly. Many people miss pills because of cost, side effects, running out, or feeling fine.</p>`;
  if(cur==="confirm")return `${dots}<div class="q">Was BP 140/90 or higher at an earlier check (another day)?</div><div class="opts">${[[true,"Yes, this is the second high reading","Diagnose and start Step 1"],[false,"No, this is the first high reading","Ask them to come back within 2 weeks"]].map(([v,t,s])=>`<button class="opt" data-confirm="${v}" aria-pressed="${w.confirm===v}"><span class="tick"></span><span>${t}<small>${s}</small></span></button>`).join("")}</div>`;
  if(cur==="danger"){const D=["Chest pain","Hard breathing","Weakness, face droop, or trouble speaking","Severe headache with vomiting or confusion","Sudden vision loss","Very little urine"];
    return `${dots}<div class="q" style="color:var(--bad)">Very high BP. Any danger signs?</div><div class="opts">${D.map((t,i)=>`<button class="opt" data-danger="${i}" aria-pressed="${w.danger.includes(i)}"><span class="tick"></span>${t}</button>`).join("")}<button class="opt" data-danger="none" aria-pressed="${w.none}"><span class="tick"></span>None of these</button></div><p class="sm muted" style="margin:0">If none: let them rest 15 minutes and measure again.</p>`}
  const {s,d}=avg(w),danger=w.danger.length>0,sg=suggest(p,s,d,w.missed,danger,w.confirm===true);V.sg=sg;
  if(w.choice==null)w.choice=(sg.next!=null&&sg.next!==(p.step||0))?"apply":"keep";
  if(w.next==null)w.next=addDays(w.date,sg.ret);
  const canApply=sg.next!=null&&sg.next!==(p.step||0);
  const Q=[["1 week",7],["2 weeks",14],["4 weeks",28],["3 months",90]];
  return `${dots}<div class="avg"><div><div style="font-weight:700">Recorded BP</div><div class="sm" style="opacity:.8">target below ${target(p).s}/${target(p).d}</div></div><b>${s}/${d}</b></div>
  <div class="sug ${sg.cls}"><span class="eyebrow" style="color:inherit">Protocol says</span><b>${esc(sg.title)}</b><ul>${sg.lines.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  ${canApply?`<div class="opts"><button class="opt" data-choice="apply" aria-pressed="${w.choice==="apply"}"><span class="tick"></span><span>${p.step?"Move":"Start"} to Step ${sg.next}<small>${esc(stepText(p,sg.next))}</small></span></button><button class="opt" data-choice="keep" aria-pressed="${w.choice==="keep"}"><span class="tick"></span><span>Keep current medicines<small>Record why in the note</small></span></button></div>`:""}
  <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem">Next visit
   <div class="opts c4">${Q.map(([t,n])=>`<button class="opt center" data-next="${addDays(w.date,n)}" aria-pressed="${w.next===addDays(w.date,n)}" style="font-size:.9rem;padding:8px 4px">${t}</button>`).join("")}</div>
   <input type="date" id="vnext" value="${w.next}" aria-label="Next visit date"></div>
  <label class="f">Note (side effects, reasons)<textarea id="vnote" rows="2">${esc(w.note)}</textarea></label>`;
}
function wizFoot(){const p=P(V.id),w=V.w,st=wizSteps(p),cur=st[w.i],last=w.i===st.length-1;
  let ok=true;const a=avg(w);if(cur==="bp")ok=!!a.s;if(cur==="pills")ok=w.missed!=null;if(cur==="confirm")ok=w.confirm!=null;if(cur==="danger")ok=w.none||w.danger.length>0;
  return `<div class="foot"><div class="foot-in"><button class="btn sec" data-act="${w.i?"wprev":"back"}">${w.i?"Back":"Cancel"}</button><button class="btn" id="wnext" data-act="${last?"wsave":"wnext"}" ${ok?"":"disabled"}>${last?"Save visit":"Next"}</button></div></div>`}
function wizBind(){
  const w=V.w,ins=[...document.querySelectorAll(".bpin")];

    el.value=el.value.replace(/\D/g,"").slice(0,3);const [i,k]=[+el.id[1],el.id[2]==="s"?0:1];w.r[i][k]=el.value;

    if(d.missed!=null){w.missed=+d.missed;rerenderKeep();return}
    if(d.confirm!=null){w.confirm=d.confirm==="true";rerenderKeep();return}
    if(d.danger!=null){if(d.danger==="none"){w.none=!w.none;w.danger=[]}else{w.none=false;const i=+d.danger;w.danger=w.danger.includes(i)?w.danger.filter(x=>x!==i):w.danger.concat(i)}w.choice=null;w.next=null;rerenderKeep();return}
    if(d.choice){w.choice=d.choice;rerenderKeep();return}
    if(d.next){w.next=d.next;rerenderKeep();return}
  }
  if(V.name==="form"){
    if(d.f){readForm();ui.form[d.f]=d.f==="pathway"?+d.v:d.v;rerenderKeep();restoreForm();return}
    if(d.cond){readForm();ui.form.cond[d.cond]=!ui.form.cond[d.cond];rerenderKeep();restoreForm();return}
  }
  const act=d.act;if(!act)return;
  if(act==="closesheet"&&e.target!==t)return;
  const p=V.id?P(V.id):null;
  switch(act){
    case "back":goBack();break;
    case "gosync":root("settings");break;
    case "closesheet":case "closesheet2":closeSheet();break;
    case "newpt":ui.form=null;go({name:"form"});break;
    case "edit":ui.form=null;go({name:"form",id:p.id,edit:true});break;
    case "visit":{const lv=lastV(p);go({name:"visit",id:p.id,w:{i:0,r:[["",""],["",""],["",""]],missed:null,confirm:null,danger:[],none:false,date:today(),next:null,note:"",choice:null}});break}
    case "addmed":addMedSheet();break;
    case "wnext":{const w=V.w;w.i++;w.choice=null;w.next=null;render();break}
    case "wprev":V.w.i--;render();break;
    case "wsave":{
      const w=V.w,{s,d}=avg(w),sg=V.sg,prev=p.step||0;const apply=w.choice==="apply"&&sg.next!=null&&sg.next!==prev;
      if(apply)applyStep(p,sg.next,w.date);
      if(sg.controlled)active(p).forEach(m=>m.status="working");
      let action=apply?(prev?`Moved from Step ${prev} to Step ${sg.next}.`:`Started Step ${sg.next}.`):(sg.next!=null&&sg.next!==prev?`Protocol suggested Step ${sg.next}; medicines kept the same.`:sg.title+".");
      if(w.danger.length)action="Danger signs: sent to hospital.";
      p.visits.push({id:uid(),date:w.date,r:w.r.map(x=>[+x[0]||null,+x[1]||null]),sbp:s,dbp:d,step:p.step||0,missed:p.step||prev?w.missed:null,action,next:w.next,note:w.note.trim()});
      p.visits.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
      touch(p);ui.tab="summary";goBack();toast(apply?`Saved. Step ${p.step} medicines added.`:"Visit saved");break}
    case "stopok":{const m=p.meds.find(x=>x.id===ui.stop.id);m.end=today();m.reason=ui.stop.reason;m.note=($("#snote").value||"").trim();m.status=null;
      if(m.reason==="allergy"&&!(p.allergies||"").toLowerCase().includes(medName(m).toLowerCase()))p.allergies=(p.allergies?p.allergies+"; ":"")+medName(m)+(m.note?": "+m.note:"");
      closeSheet();touch(p);render();toast(medName(m)+" stopped");break}
    case "amsave":{const a=ui.am,m={id:uid(),drug:a.drug,dose:a.drug==="other"?"":a.dose,name:a.drug==="other"?(($("#amother")||{}).value||"").trim():"",freq:"Once daily",start:today(),end:null,status:null,reason:null,note:""};
      if(a.drug==="other"&&!m.name){toast("Enter the medicine name");return}
      if(["ineffective","sidefx","allergy"].includes(a.status)){m.end=today();m.start="";m.reason=a.status;if(a.status==="allergy")p.allergies=(p.allergies?p.allergies+"; ":"")+medName(m)}else m.status=a.status;
      p.meds.push(m);closeSheet();touch(p);render();toast("Medicine added");break}
    case "savept":{readForm();const f=ui.form,name=(f._fname||"").trim();if(!name){toast("Enter the patient's name");$("#fname").focus();return}
      const isNew=!V.edit,x=isNew?{id:uid(),visits:[],meds:[],step:0}:P(V.id);
      Object.assign(x,{name,clinicId:(f._fid||"").trim(),birthYear:(f._fby||"").trim(),sex:f.sex,phone:(f._fph||"").trim(),kinPhone:(f._fkin||"").trim(),area:(f._farea||"").trim(),enrolled:f._fenr||today(),cuff:f.cuff,arm:f.arm,pathway:f.pathway,ras:f.ras,cond:f.cond,allergies:(f._fall||"").trim()});
      if(isNew)S.patients.push(x);touch(x);ui.form=null;if(isNew){ui.tab="summary";V={name:"patient",id:x.id};render()}else goBack();toast(isNew?"Patient created":"Saved");break}
    case "delpt":openSheet(`<h2 style="font-size:1.15rem">Delete ${esc(p.name)} from this phone?</h2><p class="muted" style="margin:0">The copy in the clinic database is kept.</p><div class="row2"><button class="btn sec" data-act="closesheet2">Keep</button><button class="btn danger" data-act="delok">Delete</button></div>`);break;
    case "delok":S.patients=S.patients.filter(x=>x.id!==p.id);S.outbox=S.outbox.filter(x=>x!==p.id);save();closeSheet();root("list");toast("Deleted from this phone");break;
    case "delex":S.patients=S.patients.filter(x=>!x.example);save();render();toast("Examples removed");break;
    case "connect":{const url=($("#curl").value||"").trim(),code=($("#ccode").value||"").trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){toast("Paste the full link that starts with https://script.google.com");return}if(!code){toast("Enter the access code");return}
      S.cfg={url,code};toast("Connecting…");try{const j=await api("ping");S.cfg.role=j.role;S.syncError=null;S.patients.filter(x=>!x.example).forEach(x=>{if(!S.outbox.includes(x.id))S.outbox.push(x.id)});save();render();toast(j.role==="staff"?"Connected as clinic phone":"Connected");sync()}catch(err){S.cfg={};save();render();toast("Could not connect: "+(err.message||err))}break}
    case "unlink":S.cfg={};S.syncError=null;save();render();toast("Disconnected");break;
    case "syncnow":S.patients.filter(x=>!x.example).forEach(x=>{if(!S.outbox.includes(x.id))S.outbox.push(x.id)});save();await sync();render();toast(S.syncError?"Could not send yet":"All records sent");break;
    case "pull":try{toast("Getting updates…");const j=await api("since",{since:S.cfg.lastPull||""});const n=merge(j.patients);S.cfg.lastPull=j.now;save();render();toast(n?`${n} patient record${n===1?"":"s"} updated`:"Already up to date")}catch(err){toast(String(err.message||err))}break;
    case "find":findList=null;ui.fq="";go({name:"find"});try{const j=await api("list");findList=j.patients;if(V.name==="find")render()}catch(err){toast(String(err.message||err));findList=[];if(V.name==="find")render()}break;
    case "backup":{const txt=JSON.stringify({app:"vitality-bp-record",version:2,exported:new Date().toISOString(),patients:S.patients.filter(x=>!x.example)}),name=`vitality-bp-backup-${today()}.json`;
      try{const file=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"BP Record backup"});toast("Backup shared");break}}catch(err){if(err&&err.name==="AbortError")break}
      try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Backup file saved")}catch(err){toast("Backup not available here")}break}
    case "restore":$("#rfile").click();break;
    case "csv":{const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const rows=[["clinic_id","name","sex","birth_year","high_risk","pathway","visit_date","sbp","dbp","step","missed_days_of_7","action","next_visit"].join(",")];
      S.patients.filter(x=>!x.example).forEach(x=>x.visits.forEach(v=>rows.push([x.clinicId,x.name,x.sex,x.birthYear,highRisk(x)?1:0,x.pathway,v.date,v.sbp,v.dbp,v.step,v.missed,v.action,v.next].map(q).join(","))));
      try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));a.download=`vitality-visits-${today()}.csv`;document.body.appendChild(a);a.click();a.remove();toast("Visits exported")}catch(err){toast("Export not available here")}break}
  }
});
function restoreForm(){const f=ui.form;[["fname","_fname"],["fid","_fid"],["fby","_fby"],["fph","_fph"],["fkin","_fkin"],["farea","_farea"],["fenr","_fenr"],["fall","_fall"]].forEach(([id,k])=>{const el=$("#"+id);if(el&&f[k]!=null)el.value=f[k]})}
function merge(list){let n=0;(list||[]).forEach(np=>{const i=S.patients.findIndex(x=>x.id===np.id);if(i<0){S.patients.push(np);n++}else if((np.updatedAt||"")>(S.patients[i].updatedAt||"")&&!S.outbox.includes(np.id)){S.patients[i]=np;n++}});save();return n}
function restoreText(txt){let d;try{d=JSON.parse(txt)}catch(e){}if(!d||!Array.isArray(d.patients)){toast("That is not a BP Record backup file");return}const n=merge(d.patients);d.patients.forEach(x=>{if(!S.outbox.includes(x.id))S.outbox.push(x.id)});save();render();toast(`Restored ${n} patient record${n===1?"":"s"}`);sync()}

/* first screen: a phone holding one real patient opens straight to them */
const real=S.patients.filter(p=>!p.example);
if(real.length===1&&S.patients.length===1){V={name:"patient",id:real[0].id};stack=[{name:"list"}];ui.tab="summary"}
try{history.replaceState({d:0},"");if(stack.length)history.pushState({d:1},"")}catch(e){}
render();sync();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
