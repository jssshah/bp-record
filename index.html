<title>Vitality BP Record</title>
<meta name="theme-color" content="#13223F">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#13223F; --muted:#56637D; --line:#D6DDE9;
  --accent:#1D5FC4; --accent-ink:#FFFFFF; --gold:#9A6A06; --gold-bg:#FFF1CF;
  --good:#1B7A4C; --good-bg:#E0F3E8; --warn:#9A5A07; --warn-bg:#FDEDD6; --bad:#B3261E; --bad-bg:#FBE3E0;
  --sbp:#13223F; --dbp:#1D5FC4;
  --sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1322; --surface:#142035; --sunk:#0F192B; --ink:#E5EBF6; --muted:#9BA9C3; --line:#28375A;
    --accent:#6EA1F3; --accent-ink:#0C1322; --gold:#F2B94A; --gold-bg:#3A2D10;
    --good:#62CE94; --good-bg:#11301F; --warn:#F2AC55; --warn-bg:#3A2710; --bad:#FF8C82; --bad-bg:#3D1715;
    --sbp:#E5EBF6; --dbp:#6EA1F3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1322; --surface:#142035; --sunk:#0F192B; --ink:#E5EBF6; --muted:#9BA9C3; --line:#28375A;
  --accent:#6EA1F3; --accent-ink:#0C1322; --gold:#F2B94A; --gold-bg:#3A2D10;
  --good:#62CE94; --good-bg:#11301F; --warn:#F2AC55; --warn-bg:#3A2710; --bad:#FF8C82; --bad-bg:#3D1715;
  --sbp:#E5EBF6; --dbp:#6EA1F3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.05rem;font-weight:800}
h3{font-size:.95rem;font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top img{width:36px;height:36px;border-radius:50%;background:#fff;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-size:.98rem;font-weight:800;letter-spacing:.01em}
.brand span{font-size:.72rem;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;background:transparent;border:1.5px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:999px;padding:6px 12px;max-width:52%;cursor:pointer}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.9rem}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner{background:var(--gold-bg);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-good{background:var(--good-bg);color:var(--good)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-gold{background:var(--gold-bg);color:var(--gold)} .c-plain{background:var(--sunk);color:var(--muted)}

.pt-name{font-size:1.35rem;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.bp-hero{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:end}
.bp-big{font-family:var(--mono);font-weight:700;font-size:2.9rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bp-big small{font-size:.9rem;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--sunk);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv dd{margin:0;font-weight:600;font-size:.95rem}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--sunk)}
.steps i.on{background:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0;padding-top:0}
.row .t{font-weight:600}
.row .s{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.med{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.med-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.med-n{font-weight:800}
.med-d{font-family:var(--mono);font-weight:600}
.med.stopped{border-style:dashed}

/* forms */
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 11px;font-weight:400;font-size:1rem;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center}
.grid3 .h{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.grid3 input{font-family:var(--mono);text-align:center;font-size:1.15rem}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{flex-direction:row;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:400;font-size:.92rem;cursor:pointer}
.check input{width:18px;height:18px;margin:0}
.avg{display:flex;justify-content:space-between;align-items:center;background:var(--sunk);border-radius:8px;padding:10px 12px}
.avg b{font-family:var(--mono);font-size:1.6rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.suggest{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1.5px solid}
.suggest.good{background:var(--good-bg);border-color:var(--good)}
.suggest.warn{background:var(--warn-bg);border-color:var(--warn)}
.suggest.bad{background:var(--bad-bg);border-color:var(--bad)}
.suggest.plain{background:var(--sunk);border-color:var(--line)}
.suggest b{font-size:1.02rem}
.suggest ul{margin:0;padding-left:18px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:9;max-width:calc(100% - 32px);text-align:center}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
textarea.code{font-family:var(--mono);font-size:.75rem;height:110px}
@media (max-width:380px){.kv{grid-template-columns:1fr 1fr}.bp-big{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
"use strict";
const KEY="vitality-bp-record-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(iso){if(!iso)return "—";const [y,m,d]=iso.split("-");return (+d)+" "+MONTHS[+m-1]+" "+y}
function fmtShort(iso){const [y,m,d]=iso.split("-");return (+d)+" "+MONTHS[+m-1]}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}

/* ---------- drugs & protocol (matches Clinical Protocols v1.0) ---------- */
const DRUGS={
  amlodipine:{n:"Amlodipine",doses:["2.5 mg","5 mg","10 mg"]},
  losartan:{n:"Losartan",doses:["25 mg","50 mg","100 mg"]},
  lisinopril:{n:"Lisinopril",doses:["5 mg","10 mg","20 mg"]},
  hctz:{n:"Hydrochlorothiazide (HCTZ)",doses:["12.5 mg","25 mg"]},
  telmisartan:{n:"Telmisartan",doses:["40 mg","80 mg"]},
  valsartan:{n:"Valsartan",doses:["80 mg","160 mg"]},
  enalapril:{n:"Enalapril",doses:["10 mg","20 mg"]},
  perindopril:{n:"Perindopril",doses:["4 mg","8 mg"]},
  nifedipine_er:{n:"Nifedipine extended-release",doses:["30 mg","60 mg"]},
  chlorthalidone:{n:"Chlorthalidone",doses:["12.5 mg","25 mg"]},
  spironolactone:{n:"Spironolactone",doses:["25 mg"]},
  atenolol:{n:"Atenolol",doses:["25 mg","50 mg","100 mg"]},
  other:{n:"Other",doses:[]}
};
const REASONS={
  ineffective:{t:"Did not control BP",cls:"c-bad",problem:true},
  sidefx:{t:"Side effect",cls:"c-warn",problem:true},
  allergy:{t:"Allergy: never give again",cls:"c-bad",problem:true},
  pregnancy:{t:"Pregnancy",cls:"c-warn",problem:false},
  dose:{t:"Dose changed",cls:"c-plain",problem:false},
  replaced:{t:"Replaced at step change",cls:"c-plain",problem:false},
  stock:{t:"Out of stock",cls:"c-plain",problem:false},
  other:{t:"Other",cls:"c-plain",problem:false}
};
function medName(m){return m.drug==="other"?(m.name||"Other medicine"):DRUGS[m.drug].n}
function age(p){return p.birthYear?(new Date().getFullYear()-(+p.birthYear)):null}
function highRisk(p){const c=p.cond||{};return !!(c.diabetes||c.kidney||c.stroke||c.mi||c.hf)}
function target(p){return highRisk(p)?{s:130,d:80}:{s:140,d:90}}
function maxStep(p){return p.pathway==2?3:4}
function stepMeds(p,step){
  const ras=p.ras||"losartan", lo=ras==="losartan"?"50 mg":"10 mg", hi=ras==="losartan"?"100 mg":"20 mg";
  const old=(age(p)||0)>=75;
  if(p.pathway==2){
    return [[],[["amlodipine","5 mg"]],[["amlodipine","5 mg"],["hctz","12.5 mg"]],[["amlodipine","10 mg"],["hctz","25 mg"]]][step]||[];
  }
  return [[],[["amlodipine","5 mg"]],[["amlodipine","5 mg"],[ras,lo]],[["amlodipine","10 mg"],[ras,hi]],[["amlodipine","10 mg"],[ras,hi],["hctz",old?"12.5 mg":"25 mg"]]][step]||[];
}
function stepText(p,step){
  if(step>maxStep(p))return "Physician review";
  if(!step)return "No medicines yet";
  return stepMeds(p,step).map(([d,dose])=>DRUGS[d].n.replace(" (HCTZ)","")+" "+dose).join(" + ");
}
function classify(p,s,d){
  if(s==null||d==null)return null;
  const t=target(p);
  if(s>=180||d>=110)return {k:"bad",t:"Very high"};
  if(s>=t.s||d>=t.d)return {k:"warn",t:"Above target"};
  return {k:"good",t:"At target"};
}
function chipFor(c){return c?`<span class="chip c-${c.k}">${c.t}</span>`:""}

/* ---------- storage ---------- */
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){state.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){mem=state}}
let state=load()||{patients:[example()],current:null,lastBackup:null};
if(!state.current&&state.patients[0])state.current=state.patients[0].id;
let view="home";
let ui={};

function cur(){return state.patients.find(p=>p.id===state.current)||null}
function lastVisit(p){return p.visits.length?p.visits[p.visits.length-1]:null}
function activeMeds(p){return p.meds.filter(m=>!m.end)}

/* ---------- example patient (clearly marked) ---------- */
function example(){
  const v=(date,r,step,missed,action,next,note)=>({id:uid(),date,r,sbp:Math.round((r[1][0]+r[2][0])/2),dbp:Math.round((r[1][1]+r[2][1])/2),step,missed,action,next,note:note||""});

/* ---------- protocol engine ---------- */
function suggest(p,s,d,missed,danger,confirmFlag){
  const t=target(p), c=classify(p,s,d), step=p.step||0, max=maxStep(p);
  if(!c)return null;
  const very=c.k==="bad";
  if(danger)return {cls:"bad",title:"Emergency: send to hospital now",lines:["Arrange transport and call ahead. Send a note with these readings and all medicines.","Do not give any drug to drop the BP fast.","Call the patient or family within 48 hours."],next:null,ret:2};
  if(step===0){
    if(s>=160||d>=100)return {cls:very?"bad":"warn",title:"Hypertension: start Step 2 today",lines:[stepText(p,2),"Stop any other BP medicines the patient bought elsewhere (record why on the Medicines tab)."].concat(very?["BP is very high: repeat after 15 minutes of rest. Return within 1 week."]:["Return in 4 weeks."]),next:2,ret:very?7:28};
    if(s>=140||d>=90){
      if(confirmFlag)return {cls:"warn",title:"Confirmed: start Step 1",lines:[stepText(p,1),"Return in 4 weeks."],next:1,ret:28};
      return {cls:"warn",title:"Possible hypertension: confirm on another day",lines:["Return within 2 weeks for a second check before starting medicines.","If this IS the second check, tick \"Confirmation visit\" above."],next:null,ret:14};
    }
    if(highRisk(p)&&(s>=130||d>=80))return {cls:"plain",title:"High-normal in a high-risk patient",lines:["Physician decides whether to start medicines.","Salt and lifestyle advice. Recheck in 3 months."],next:null,ret:90};
    return {cls:"good",title:"No hypertension today",lines:["Healthy-living advice. Recheck in 1 year (6 months if 130–139 / 80–89)."],next:null,ret:(s>=130||d>=80)?182:365};
  }
  if(c.k==="good")return {cls:"good",title:"At target: keep the same medicines",lines:["Medicines on this step are now marked as working.","Return in 3 months. After 2 controlled visits, a 3-month supply is fine if stock allows."],next:step,ret:90,controlled:true};
  if(missed!=null&&missed>=2)return {cls:"warn",title:"Not taking pills every day: fix that first",lines:["Ask why: cost, side effect, ran out, felt fine, uses herbs.","Keep the same step. Do not move up yet.","Return in 4 weeks."],next:step,ret:very?7:28};
  if(step>=max)return {cls:very?"bad":"warn",title:"Not at target on the last step: physician review",lines:["Check measurement and count leftover pills.","Physician decides next steps (Protocol B7). Priority for echo when available."],next:null,ret:very?7:28};
  return {cls:very?"bad":"warn",title:`Above target: move up to Step ${step+1}`,lines:[stepText(p,step+1)].concat(very?["BP is very high: check danger signs, repeat after 15 minutes of rest. Return within 1 week."]:["Return in 4 weeks."]),next:step+1,ret:very?7:28};
}

function applyStep(p,newStep,date){
  const want=stepMeds(p,newStep);
  const act=activeMeds(p);
  const kept=new Set();
  act.forEach(m=>{
    const w=want.find(([dr])=>dr===m.drug);
    if(w&&w[1]===m.dose){kept.add(m.drug);m.status="titrating";return}
    m.end=date;
    if(w){m.reason="dose";m.note=(m.note?m.note+" ":"")+`Changed to ${w[1]} at Step ${newStep}.`}
    else if(!m.reason){m.reason="replaced";m.note=(m.note?m.note+" ":"")+`Not part of Step ${newStep}.`}
  });
  want.forEach(([dr,dose])=>{if(!kept.has(dr))p.meds.push({id:uid(),drug:dr,dose,freq:"Once daily",start:date,end:null,status:"titrating",reason:null,note:""})});
  p.step=newStep;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view?"page":"false"));
  const p=cur();
  $("#whoName").textContent=p?p.name:"Patients";
  const app=$("#app");
  if(!p&&!["patients","profile","backup"].includes(view))view="patients";
  app.innerHTML=({home:vHome,visit:vVisit,meds:vMeds,backup:vBackup,patients:vPatients,profile:vProfile})[view](p);
  bind[view]&&bind[view](p);
  window.scrollTo(0,0);
}

function statusChip(m){
  if(m.end){const r=REASONS[m.reason]||REASONS.other;return `<span class="chip ${r.cls}">${r.t}</span>`}
  if(m.status==="working")return `<span class="chip c-good">Working</span>`;
  return `<span class="chip c-gold">Adjusting</span>`;
}

function chart(p){
  const vs=p.visits;
  if(vs.length<2)return `<p class="muted small">The chart appears after 2 visits.</p>`;
  const W=340,H=190,L=34,R=10,T=12,B=30,t=target(p);
  let lo=Math.min(60,...vs.map(v=>v.dbp-10)),hi=Math.max(200,...vs.map(v=>v.sbp+10));
  lo=Math.floor(lo/20)*20;hi=Math.ceil(hi/20)*20;
  const x=i=>L+(vs.length===1?0:i*(W-L-R)/(vs.length-1)), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g="";
  for(let v=lo;v<=hi;v+=20){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--mono)">${v}</text>`}
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(t.s)}" y2="${y(t.s)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${y(t.s)-4}" text-anchor="start" font-size="9.5" fill="var(--good)" font-weight="600">target ${t.s}</text>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(t.d)}" y2="${y(t.d)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${y(t.d)-4}" text-anchor="start" font-size="9.5" fill="var(--good)" font-weight="600">target ${t.d}</text>`;
  const path=k=>vs.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v[k]).toFixed(1)).join(" ");
  g+=`<path d="${path("sbp")}" fill="none" stroke="var(--sbp)" stroke-width="2.5" stroke-linejoin="round"/>`;
  g+=`<path d="${path("dbp")}" fill="none" stroke="var(--dbp)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const every=Math.ceil(vs.length/5);
  vs.forEach((v,i)=>{
    const last=i===vs.length-1;
    g+=`<circle cx="${x(i)}" cy="${y(v.sbp)}" r="${last?5:3.5}" fill="var(--sbp)" stroke="var(--surface)" stroke-width="1.5"/><circle cx="${x(i)}" cy="${y(v.dbp)}" r="${last?5:3.5}" fill="var(--dbp)" stroke="var(--surface)" stroke-width="1.5"/>`;
    if(last){g+=`<text x="${x(i)-8}" y="${y(v.sbp)-9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--sbp)" font-family="var(--mono)">${v.sbp}</text><text x="${x(i)-8}" y="${y(v.dbp)+16}" text-anchor="end" font-size="11" font-weight="700" fill="var(--dbp)" font-family="var(--mono)">${v.dbp}</text>`}
    if(i%every===0||last){const anc=i===0?"start":last?"end":"middle";g+=`<text x="${x(i)}" y="${H-12}" text-anchor="${anc}" font-size="10" fill="var(--muted)">${fmtShort(v.date)}</text>`}
    if(v.step&&(i===0||vs[i-1].step!==v.step))g+=`<text x="${x(i)}" y="${H-1}" text-anchor="${i===0?"start":last?"end":"middle"}" font-size="9.5" font-weight="700" fill="var(--accent)">S${v.step}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of systolic and diastolic BP at each visit, with target lines">${g}</svg><p class="muted small" style="margin:0">S2, S3… mark the visit where the treatment step changed.</p>`;
}

function readVisit(){
  const n=id=>{const v=parseInt($(id).value,10);return isFinite(v)&&v>30&&v<300?v:null};
  const r=[1,2,3].map(i=>[n("#r"+i+"s"),n("#r"+i+"d")]);
  let s=null,d=null;
  if(r[1][0]&&r[2][0]&&r[1][1]&&r[2][1]){s=Math.round((r[1][0]+r[2][0])/2);d=Math.round((r[1][1]+r[2][1])/2)}
  else if(r[0][0]&&r[0][1]&&!r[1][0]&&!r[2][0]){s=r[0][0];d=r[0][1]}
  return {r,s,d};
}

}

}

function vPatients(){
  const rows=state.patients.map(p=>{const lv=lastVisit(p),nd=lv&&lv.next?daysBetween(today(),lv.next):null;return `<button class="row" data-pick="${p.id}" type="button" style="background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer;${p.id===state.current?"":""}">
    <span class="t">${esc(p.name)}${p.id===state.current?` <span class="chip c-plain">Open</span>`:""}</span>${lv?chipFor(classify(p,lv.sbp,lv.dbp)):`<span class="chip c-plain">No visits</span>`}
    <span class="s">${esc(p.clinicId||"")} · ${lv?`<span class="num">${lv.sbp}/${lv.dbp}</span> on ${fmtShort(lv.date)}`:"—"}${nd!=null?` · next ${nd<0?`<b style="color:var(--bad)">${-nd} days overdue</b>`:fmtShort(lv.next)}`:""}</span></button>`}).join("");
  return `<section class="panel"><div class="panel-h"><h1 style="font-size:1.2rem;font-weight:800">Patients on this phone</h1><span class="muted small">${state.patients.length}</span></div>
    ${state.patients.length?`<div class="list">${rows}</div>`:`<p class="muted">No patients yet.</p>`}
    <button class="btn full" data-act="newpt" type="button">Add new patient</button>
    <p class="small muted" style="margin:0">A patient's own phone normally holds one record. A family sharing a phone, or the clinic tablet, can hold several.</p></section>`;
}

function vProfile(p){
  const e=ui.newPatient?null:p;
  const c=(e&&e.cond)||{};
  const v=(k,d="")=>esc(e&&e[k]!=null?e[k]:d);
  return `<section class="panel">
    <h1 style="font-size:1.2rem;font-weight:800">${e?"Edit patient":"New patient"}</h1>
    <label>Full name<input id="pName" value="${v("name")}" autocomplete="off"></label>
    <div class="grid2"><label>Clinic ID<input id="pId" value="${v("clinicId","VHC-")}"></label><label>Enrolled<input type="date" id="pEnr" value="${v("enrolled",today())}"></label></div>
    <div class="grid2"><label>Birth year<input id="pBy" inputmode="numeric" value="${v("birthYear")}" placeholder="e.g. 1972"></label><label>Sex<select id="pSex"><option value="F" ${e&&e.sex==="F"?"selected":""}>Female</option><option value="M" ${e&&e.sex==="M"?"selected":""}>Male</option></select></label></div>
    <div class="grid2"><label>Phone<input id="pPh" inputmode="tel" value="${v("phone")}"></label><label>Next-of-kin phone<input id="pKin" inputmode="tel" value="${v("kinPhone")}"></label></div>
    <label>Home area and landmark<input id="pArea" value="${v("area")}"></label>
    <div class="grid2"><label>Cuff size<select id="pCuff">${["Small (17–22 cm)","Standard (22–32 cm)","Large (32–42 cm)"].map(o=>`<option ${e&&e.cuff===o?"selected":(!e&&o.startsWith("Standard")?"selected":"")}>${o}</option>`).join("")}</select></label><label>Arm used<select id="pArm">${["Left","Right"].map(o=>`<option ${e&&e.arm===o?"selected":""}>${o}</option>`).join("")}</select></label></div>
    <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px"><legend class="small" style="font-weight:600;margin-bottom:6px">High-risk conditions (target below 130/80)</legend>
      <div class="checks">${[["diabetes","Diabetes"],["kidney","Kidney disease"],["stroke","Past stroke"],["mi","Past heart attack"],["hf","Heart failure"]].map(([k,t])=>`<label class="check"><input type="checkbox" id="c_${k}" ${c[k]?"checked":""}>${t}</label>`).join("")}</div></fieldset>
    <label>Treatment pathway<select id="pPath"><option value="1" ${!e||e.pathway!=2?"selected":""}>Pathway 1: standard</option><option value="2" ${e&&e.pathway==2?"selected":""}>Pathway 2: could become pregnant, no reliable family planning (no ACE/ARB)</option></select></label>
    <label>Second drug<select id="pRas"><option value="losartan" ${!e||e.ras!=="lisinopril"?"selected":""}>Losartan (preferred)</option><option value="lisinopril" ${e&&e.ras==="lisinopril"?"selected":""}>Lisinopril (if no losartan)</option></select></label>
    <label>Allergies or drugs never to give<input id="pAll" value="${v("allergies")}" placeholder="e.g. lisinopril: face swelling"></label>
    <div class="btns"><button class="btn" data-act="savept" type="button">${e?"Save changes":"Create patient"}</button><button class="btn sec" data-act="cancelpt" type="button">Cancel</button></div>
    ${e&&!ui.confirmDel?`<button class="link" data-act="delpt" type="button" style="color:var(--bad);align-self:flex-start">Delete this patient</button>`:""}
    ${e&&ui.confirmDel?`<div class="suggest bad"><b>Delete ${esc(e.name)} and all visits from this phone?</b><span class="small">Make a backup first if unsure. This cannot be undone.</span><div class="btns"><button class="btn danger" data-act="delok" type="button">Delete</button><button class="btn sec" data-act="delno" type="button">Keep</button></div></div>`:""}
  </section>`;
}

/* ---------- binding ---------- */
const bind={
  visit(p){
    const upd=()=>{
      const {s,d}=readVisit();
      $("#avgOut").textContent=s?`${s}/${d}`:"—/—";
      const very=s&&(s>=180||d>=110);
      $("#dangerBox").hidden=!very;
      const danger=very&&[...document.querySelectorAll(".dsign")].some(x=>x.checked);
      const missed=$("#vMissed")?+$("#vMissed").value:null;
      const conf=$("#vConfirm")?$("#vConfirm").checked:false;
      const sg=s?suggest(p,s,d,missed,danger,conf):null;
      ui.sug=sg;
      $("#sugOut").innerHTML=sg?`<div class="suggest ${sg.cls}"><span class="small" style="text-transform:uppercase;letter-spacing:.06em;font-weight:600">Protocol says</span><b>${esc(sg.title)}</b><ul>${sg.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`:`<div class="suggest plain"><span class="small">Enter readings 2 and 3 to see what the protocol says.</span></div>`;
      if(sg&&sg.ret&&!ui.nextTouched)$("#vNext").value=addDays($("#vDate").value||today(),sg.ret);
      const canApply=sg&&sg.next!=null&&sg.next!==(p.step||0);
      $("#saveBtns").innerHTML=s?(canApply?`<button class="btn" data-act="savevisit" data-apply="1" type="button">Save and start Step ${sg.next}</button><button class="btn sec" data-act="savevisit" type="button">Save, keep medicines</button>`:`<button class="btn" data-act="savevisit" type="button">Save visit</button>`):`<button class="btn" type="button" disabled>Save visit</button>`;
    };
    ui.nextTouched=false;
    ui.onUpdate=e=>{if(e&&e.target&&e.target.id==="vNext")ui.nextTouched=true;upd()};
    upd();
  },
  meds(p){
    const fill=()=>{const k=$("#mDrug").value;$("#mDose").innerHTML=DRUGS[k].doses.map(d=>`<option>${d}</option>`).join("")||`<option value="">—</option>`;$("#mOtherWrap").hidden=k!=="other";$("#mDose").disabled=k==="other"};
    $("#mDrug").addEventListener("change",fill);fill();
  },
  backup(){
    const prev=(txt)=>{
      let data=null;try{data=JSON.parse(txt)}catch(e){}
      if(!data||!Array.isArray(data.patients)){$("#rPreview").innerHTML=txt.trim()?`<div class="suggest bad"><b>This is not a BP Record backup.</b><span class="small">Choose the .json file saved from this app.</span></div>`:"";return}
      ui.restore=data;
      const nv=data.patients.reduce((a,p)=>a+(p.visits||[]).length,0);
      $("#rPreview").innerHTML=`<div class="suggest plain"><b>${data.patients.length} patient${data.patients.length===1?"":"s"}, ${nv} visits</b><span class="small">Saved ${data.exported?fmt(data.exported.slice(0,10)):"(date unknown)"}. Add merges by patient and keeps the newer copy of each.</span><div class="btns"><button class="btn" data-act="merge" type="button">Add to this phone</button><button class="btn danger" data-act="replace" type="button">Replace everything</button></div></div>`;
    };
    $("#rFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>prev(String(r.result));r.readAsText(f)});
    $("#rText").addEventListener("input",e=>prev(e.target.value));
  }
};

document.getElementById("app").addEventListener("input",e=>{ui.onUpdate&&ui.onUpdate(e)});
document.getElementById("app").addEventListener("change",e=>{ui.onUpdate&&ui.onUpdate(e)});
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}
function backupData(){return {app:"vitality-bp-record",version:1,exported:new Date().toISOString(),patients:state.patients}}
function backupName(){const p=cur();const tag=state.patients.length===1&&p?(p.clinicId||p.name).replace(/[^A-Za-z0-9-]+/g,"_"):"all";return `vitality-bp-${tag}-${today()}.json`}
function markBackup(){state.lastBackup=new Date().toISOString();save()}
function download(name,text,type){
  try{const blob=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}catch(e){return false}
}

document.addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]"),tab=e.target.closest(".tab"),pick=e.target.closest("[data-pick]"),actEl=e.target.closest("[data-act]");
  if(tab){view=tab.dataset.view;ui={};render();return}
  if(go){view=go.dataset.go;ui={};render();return}
  if(e.target.closest("#whoBtn")){view="patients";ui={};render();return}
  if(pick){state.current=pick.dataset.pick;save();view="home";render();return}
  if(!actEl)return;
  const act=actEl.dataset.act,p=cur();
  switch(act){
    case "newpt":ui={newPatient:true};view="profile";render();break;
    case "profile":ui={};view="profile";render();break;
    case "cancelpt":ui={};view=cur()?"home":"patients";render();break;
    case "delpt":ui.confirmDel=true;render();break;
    case "delno":ui.confirmDel=false;render();break;
    case "delok":state.patients=state.patients.filter(x=>x.id!==p.id);state.current=state.patients[0]?state.patients[0].id:null;save();ui={};view=state.current?"home":"patients";render();toast("Patient deleted");break;
    case "delex":state.patients=state.patients.filter(x=>!x.example);if(!cur())state.current=state.patients[0]?state.patients[0].id:null;save();render();toast("Example removed");break;
    case "savept":{
      const name=$("#pName").value.trim();if(!name){$("#pName").focus();toast("Enter the patient's name");return}
      const wasNew=!!ui.newPatient;
      const t=ui.newPatient?{id:uid(),visits:[],meds:[],step:0}:p;
      Object.assign(t,{name,clinicId:$("#pId").value.trim(),enrolled:$("#pEnr").value||today(),birthYear:$("#pBy").value.trim(),sex:$("#pSex").value,phone:$("#pPh").value.trim(),kinPhone:$("#pKin").value.trim(),area:$("#pArea").value.trim(),cuff:$("#pCuff").value,arm:$("#pArm").value,pathway:+$("#pPath").value,ras:$("#pRas").value,allergies:$("#pAll").value.trim(),updatedAt:new Date().toISOString(),
        cond:{diabetes:$("#c_diabetes").checked,kidney:$("#c_kidney").checked,stroke:$("#c_stroke").checked,mi:$("#c_mi").checked,hf:$("#c_hf").checked}});
      if(ui.newPatient){state.patients.push(t);state.current=t.id}
      save();ui={};view="home";render();toast(wasNew?"Patient saved":"Saved");break;}
    case "savevisit":{
      const {r,s,d}=readVisit();const sg=ui.sug;const date=$("#vDate").value||today();
      const apply=actEl.dataset.apply==="1"&&sg&&sg.next!=null;
      const prevStep=p.step||0;
      if(apply)applyStep(p,sg.next,date);
      if(sg&&sg.controlled)activeMeds(p).forEach(m=>m.status="working");
      const missed=$("#vMissed")?+$("#vMissed").value:null;
      let action=sg?sg.title+".":"";
      if(apply)action=prevStep?`Moved from Step ${prevStep} to Step ${sg.next}.`:`Started Step ${sg.next}.`;
      else if(sg&&sg.next!=null&&sg.next!==prevStep)action="Protocol suggested Step "+sg.next+"; medicines kept the same.";
      p.visits.push({id:uid(),date,r,sbp:s,dbp:d,step:p.step||0,missed,action,next:$("#vNext").value||null,note:$("#vNote").value.trim()});
      p.visits.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
      p.updatedAt=new Date().toISOString();save();ui={};view="home";render();toast(apply?`Visit saved. Step ${p.step} medicines added.`:"Visit saved");break;}
    case "stop":ui.stopping=actEl.dataset.id;render();break;
    case "stopcancel":ui.stopping=null;render();break;
    case "stopok":{
      const m=p.meds.find(x=>x.id===actEl.dataset.id);m.end=today();m.reason=$("#sReason").value;m.note=$("#sNote").value.trim();m.status=null;
      if(m.reason==="allergy"&&!(p.allergies||"").toLowerCase().includes(medName(m).toLowerCase()))p.allergies=(p.allergies?p.allergies+"; ":"")+medName(m)+(m.note?": "+m.note:"");
      p.updatedAt=new Date().toISOString();ui.stopping=null;save();render();toast(`${medName(m)} stopped`);break;}
    case "mAdd":break;
    case "share":{
      const txt=JSON.stringify(backupData());const name=backupName();
      try{
        const file=new File([txt],name,{type:"application/json"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Vitality BP backup"});markBackup();render();toast("Backup shared");break}
      }catch(err){if(err&&err.name==="AbortError"){toast("Backup cancelled");break}}
      if(download(name,txt,"application/json")){markBackup();render();toast("Backup file downloaded. Upload it to Google Drive.")}else toast("Use Copy backup text instead");break;}
    case "download":{if(download(backupName(),JSON.stringify(backupData()),"application/json")){markBackup();render();toast("Backup file downloaded")}break;}
    case "copy":{
      const txt=JSON.stringify(backupData());const box=$("#copyBox");box.value=txt;box.hidden=false;
      try{await navigator.clipboard.writeText(txt);markBackup();toast("Backup text copied")}catch(err){box.focus();box.select();toast("Text selected: copy it and paste into a Google Doc")}break;}
    case "csv":{
      const head=["clinic_id","name","sex","birth_year","high_risk","pathway","visit_date","sbp","dbp","step","missed_days_of_7","action","next_visit"];
      const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
      const rows=[head.join(",")];state.patients.forEach(p=>p.visits.forEach(v=>rows.push([p.clinicId,p.name,p.sex,p.birthYear,highRisk(p)?1:0,p.pathway,v.date,v.sbp,v.dbp,v.step,v.missed,v.action,v.next].map(q).join(","))));
      download(`vitality-bp-visits-${today()}.csv`,rows.join("\n"),"text/csv")?toast("Visits exported"):toast("Export not available here");break;}
    case "merge":case "replace":{
      const inc=ui.restore.patients;
      if(act==="replace"){state.patients=inc}else{inc.forEach(ip=>{const i=state.patients.findIndex(x=>x.id===ip.id);if(i<0)state.patients.push(ip);else if((ip.updatedAt||"")>(state.patients[i].updatedAt||""))state.patients[i]=ip})}
      state.current=state.patients[0]?(state.patients.find(x=>x.id===state.current)?state.current:state.patients[0].id):null;save();ui={};view="home";render();toast("Backup restored");break;}
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#mAdd"))return;
  const p=cur(),k=$("#mDrug").value,st=$("#mStatus").value;
  const m={id:uid(),drug:k,name:k==="other"?$("#mOther").value.trim():"",dose:k==="other"?"":$("#mDose").value,freq:$("#mFreq").value,start:$("#mStart").value||today(),end:null,status:null,reason:null,note:$("#mNote").value.trim()};
  if(k==="other"&&!m.name){toast("Enter the medicine name");return}
  if(st.startsWith("past-")){m.end=m.start;m.start="";m.reason=st.slice(5)}else m.status=st;
  if(m.reason==="allergy")p.allergies=(p.allergies?p.allergies+"; ":"")+medName(m);
  p.meds.push(m);p.updatedAt=new Date().toISOString();save();render();toast("Medicine added");
});

render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
